<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="../tools/lab-shim.js"></script>
<title>Complex Function Kaleidoscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
  Complex Function Kaleidoscope — domain coloring of a rational function
      f(z) = prod (z - a_i) / prod (z - b_j)
  whose zeros a_i and poles b_j are draggable handles.
  Everything is computed through the logarithmic derivative: log f is a sum of
  log(z - a) terms, so hue = arg f and the log|f| contours never overflow, and
  f'/f = sum 1/(z - a) - sum 1/(z - b) gives the exact screen-space density of
  both the phase lines and the modulus contours (Cauchy-Riemann: |grad log|f|| =
  |grad arg f| = |f'/f|). That density antialiases every line analytically and
  fades the infinitely dense rings around each zero and pole to their average.
  Options: iterate f(f(z)), and pre-warp z -> z^k (k-fold symmetric copies).
*/
:root { --panel-bg: rgba(18, 14, 30, 0.8); --panel-fg: #efe9f7; --panel-muted: #b0a6c4; --accent: #c9a7ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel-bg: rgba(18, 14, 30, 0.8); } }
:root[data-theme="dark"] { --panel-bg: rgba(18, 14, 30, 0.8); }
html, body { height: 100%; margin: 0; }
body { background: #000; overflow: hidden; font-family: "Instrument Sans", system-ui, -apple-system, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
canvas.over { cursor: grab; } canvas.drag { cursor: grabbing; }
.panel { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100vw - 24px));
  background: var(--panel-bg); color: var(--panel-fg); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 13px; line-height: 1.4; max-height: calc(100vh - 80px); overflow: auto; }
.hidden { display: none !important; }
.panel summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; }
.panel summary::-webkit-details-marker { display: none; }
.body { padding: 2px 14px 14px; display: grid; gap: 9px; }
label { display: grid; grid-template-columns: 88px 1fr 50px; align-items: center; gap: 8px; color: var(--panel-muted); }
label.check { grid-template-columns: auto 1fr; }
label output { color: var(--panel-fg); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
select, button { font: inherit; color: var(--panel-fg); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
select { flex: 1; }
select option { color: #1b1b1b; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--panel-muted); font-size: 12px; }
.formula { font: 12px ui-monospace, Consolas, monospace; color: var(--panel-fg); opacity: 0.85; }
.error { color: #ffb4a8; white-space: pre-wrap; font-size: 12px; }
.error:empty { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<details class="panel" id="panel" open>
  <summary>Complex Function Kaleidoscope</summary>
  <div class="body">
    <div class="row">
      <select id="preset" aria-label="Preset">
        <option value="0">Three zeros, two poles</option>
        <option value="1">Pentagon dipoles</option>
        <option value="2">Blaschke product</option>
        <option value="3">Iterated cubic</option>
        <option value="4">Warped quartet</option>
      </select>
      <select id="style" aria-label="Style">
        <option value="0">Neon grid</option>
        <option value="1">Enhanced phase</option>
        <option value="2">Acid checker</option>
      </select>
    </div>
    <div class="row">
      <button id="addZ">+ Zero</button>
      <button id="addP">+ Pole</button>
      <button id="del">Remove last</button>
      <button id="reseed">Reseed</button>
    </div>
    <label>Phase spin <input type="range" id="spin" min="-1" max="1" step="0.01" value="0.3"><output id="spino"></output></label>
    <label>Contour flow <input type="range" id="flow" min="-1" max="1" step="0.01" value="0.4"><output id="flowo"></output></label>
    <label>Phase lines <input type="range" id="lines" min="0" max="24" step="1" value="12"><output id="lineso"></output></label>
    <label>Warp z^k <input type="range" id="warp" min="1" max="6" step="1" value="1"><output id="warpo"></output></label>
    <label class="check"><input type="checkbox" id="iter"> Iterate f(f(z))</label>
    <label class="check"><input type="checkbox" id="drift" checked> Drift handles</label>
    <div class="formula" id="formula"></div>
    <div class="row">
      <button id="fs">Full screen</button>
      <button id="hide">Hide controls</button>
    </div>
    <div class="hint">Drag the rings (zeros) and crosses (poles). Click empty space to add a zero, right-click or Shift-click to add a pole, right-click or double-click a handle to remove it. Scroll to zoom, drag empty space to pan. H toggles controls, R records.</div>
    <div class="error" id="err"></div>
  </div>
</details>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  const gl = canvas.getContext("webgl2", { antialias: false });
  if (!gl) { $("err").textContent = "This doodle needs WebGL2, which this browser does not provide."; return; }
  const MAXN = 8;

  const VS = `#version 300 es
  in vec2 pos; void main(){ gl_Position = vec4(pos, 0.0, 1.0); }`;

  const FS = `#version 300 es
  precision highp float;
  out vec4 outColor;
  uniform vec2 uRes, uView;          // view center (z units)
  uniform float uScale;              // half-height of the view in z units
  uniform vec2 uZ[${MAXN}], uP[${MAXN}];
  uniform int uNZ, uNP, uStyle, uIter, uHandles, uHot;
  uniform float uSpin, uFlow, uLines, uWarp;
  uniform vec3 uPal;
  #define TAU 6.28318530718
  #define LN2 0.69314718056

  vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
  vec2 cinv(vec2 a) { return vec2(a.x, -a.y) / max(dot(a, a), 1e-30); }
  vec2 cexp(vec2 a) { return exp(clamp(a.x, -40.0, 40.0)) * vec2(cos(a.y), sin(a.y)); }
  // hue wheel with an integer frequency, so it is exactly periodic in arg f
  vec3 pal(float t) { return 0.5 + 0.5 * cos(TAU * (t + uPal)); }

  // log f(z) = sum log(z - a) - sum log(z - b), and D = f'/f.
  // The imaginary part is a sum of principal args: it differs from a continuous
  // arg f by multiples of 2*pi, which every periodic use below ignores.
  void logf(vec2 z, out vec2 L, out vec2 D) {
    L = vec2(0.0); D = vec2(0.0);
    for (int i = 0; i < ${MAXN}; i++) {
      if (i >= uNZ) break;
      vec2 d = z - uZ[i];
      L += vec2(0.5 * log(max(dot(d, d), 1e-30)), atan(d.y, d.x)); D += cinv(d);
    }
    for (int i = 0; i < ${MAXN}; i++) {
      if (i >= uNP) break;
      vec2 d = z - uP[i];
      L -= vec2(0.5 * log(max(dot(d, d), 1e-30)), atan(d.y, d.x)); D -= cinv(d);
    }
  }

  // Box-filtered sawtooth fract(x) over a footprint w (exact integral), fading to 0.5
  float sawAA(float x, float w) {
    w = max(w, 1e-4);
    float a = x - 0.5 * w, b = x + 0.5 * w;
    float Fa = floor(a) * 0.5 + 0.5 * fract(a) * fract(a);
    float Fb = floor(b) * 0.5 + 0.5 * fract(b) * fract(b);
    return mix((Fb - Fa) / w, 0.5, smoothstep(0.5, 1.0, w));
  }
  // Filtered square wave for checkers
  float stripe(float x, float fx) {
    float s = clamp(0.5 + (0.25 - abs(fract(x) - 0.5)) / max(fx, 1e-5), 0.0, 1.0);
    return mix(s, 0.5, smoothstep(0.25, 0.7, fx));
  }
  // Line at every integer of x: core ~wpx pixels wide plus a soft glow; merges to its mean when dense
  float neon(float x, float fx, float wpx, float glowPx) {
    fx = max(fx, 1e-6);
    float d = abs(fract(x + 0.5) - 0.5) / fx;
    float core = 1.0 - smoothstep(wpx * 0.5 - 0.6, wpx * 0.5 + 0.6, d);
    float glow = exp(-d / glowPx) * 0.5;
    return mix(0.25, core + glow, smoothstep(0.35, 0.1, fx));
  }

  void main() {
    float pix = uScale / (0.5 * uRes.y);
    vec2 z = (gl_FragCoord.xy - 0.5 * uRes) * pix + uView;

    // Optional warp z -> z^k (k-fold symmetric copies); chain factor d(z^k)/dz = k z^k / z
    vec2 zz = z, chain = vec2(1.0, 0.0);
    if (uWarp > 1.5) {
      float r = max(length(z), 1e-12), a = atan(z.y, z.x);
      zz = pow(r, uWarp) * vec2(cos(uWarp * a), sin(uWarp * a));
      chain = uWarp * cmul(zz, cinv(z));
    }
    vec2 L, D;
    logf(zz, L, D);
    D = cmul(D, chain);
    if (uIter == 1) {
      // f(f(z)): (f o f)'/(f o f) = (f'/f)(w) * f'(z), with w = f(z) and f'(z) = f(z) * D
      vec2 w = cexp(L), L2, D2;
      logf(w, L2, D2);
      D = cmul(D2, cmul(w, D));
      L = L2;
    }
    float g = length(D) * pix;                          // |d log f| per pixel

    float ph = L.y / TAU + uSpin;                        // phase in turns, spinning
    float m = L.x / LN2 - uFlow;                         // log2 |f|, flowing
    float fm = g / LN2, fq = g * max(uLines, 1.0) / TAU;
    vec3 hue = pal(ph);
    vec3 col;
    if (uStyle == 0) {
      // Neon grid: dark glass, glowing modulus contours and phase rays in the local hue
      float saw = sawAA(m, fm);
      float mod_ = neon(m, fm, 2.2, 5.0);
      float phl = uLines > 0.5 ? neon(ph * uLines, fq, 1.6, 3.0) : 0.0;
      col = hue * (0.06 + 0.32 * saw * saw) + hue * mod_ * 1.1 + pal(ph + 0.5) * phl * 0.7;
      col += vec3(1.0) * max(mod_ - 0.9, 0.0) * 0.6;
    } else if (uStyle == 1) {
      // Enhanced phase portrait: hue = arg f, brightness sawtooth from log|f|, phase shading
      float saw = sawAA(m, fm);
      float sq = uLines > 0.5 ? sawAA(ph * uLines, fq) : 0.5;
      col = hue * (0.45 + 0.55 * saw) * (0.7 + 0.45 * sq);
    } else {
      // Acid checker: the conformal grid (log|f|, arg f) makes little squares everywhere
      float n = max(uLines, 2.0);
      float cu = stripe(m, fm), cv = stripe(ph * n, fq);
      float chk = cu + cv - 2.0 * cu * cv;
      vec3 h2 = pal(3.0 * ph + 0.35 * floor(m));
      col = mix(hue * 0.12, h2 * 1.15, chk) + pal(ph + 0.5) * neon(m, fm, 1.4, 2.5) * 0.35;
    }

    // Zero/pole handles, drawn in pixels: zeros are rings, poles are rings with a cross
    if (uHandles == 1) {
      for (int i = 0; i < ${MAXN * 2}; i++) {
        bool isZ = i < ${MAXN};
        int j = isZ ? i : i - ${MAXN};
        if (isZ && j >= uNZ) continue;
        if (!isZ && j >= uNP) continue;
        vec2 h = isZ ? uZ[j] : uP[j];
        vec2 dv = (z - h) / pix;
        float d = length(dv);
        float R = (i == uHot) ? 13.0 : 10.0;
        float ring = 1.0 - smoothstep(1.0, 2.2, abs(d - R));
        float shadow = 1.0 - smoothstep(2.0, 4.5, abs(d - R));
        float mark = 0.0;
        if (!isZ) {
          vec2 a = abs(mat2(0.7071, 0.7071, -0.7071, 0.7071) * dv);
          mark = (1.0 - smoothstep(0.8, 1.9, min(a.x, a.y))) * step(d, R - 2.0);
        } else {
          mark = 1.0 - smoothstep(1.5, 2.8, d);
        }
        col = mix(col, vec3(0.0), shadow * 0.55);
        col = mix(col, vec3(1.0), max(ring, mark));
      }
    }
    vec2 q = gl_FragCoord.xy / uRes - 0.5;
    col *= 1.0 - 0.45 * dot(q, q);
    col = 1.0 - exp(-col * 1.4);
    outColor = vec4(pow(col, vec3(0.92)), 1.0);
  }`;

  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { $("err").textContent = "Shader error:\n" + e.message; return; }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "pos");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ["uRes", "uView", "uScale", "uZ", "uP", "uNZ", "uNP", "uStyle", "uIter", "uHandles", "uHot", "uSpin", "uFlow", "uLines", "uWarp", "uPal"]
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // ---------- Seeded randomness (palette + drift phases) ----------
  let seed = 1;
  function rng() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  let palOff = [0.0, 0.33, 0.67];

  // ---------- Handles ----------
  // Each handle has a base position (bx, by) set by presets or dragging; drift adds a small Lissajous orbit.
  const zeros = [], poles = [];
  const mk = (x, y) => ({ bx: x, by: y, x, y, f1: 0.2 + rng() * 0.3, f2: 0.2 + rng() * 0.3, p1: rng() * 6.28, p2: rng() * 6.28 });
  const polar = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
  const PRESETS = [
    { z: [[0, 1.05], [-0.95, -0.55], [0.95, -0.55]], p: [[-0.45, 0.15], [0.45, 0.15]], warp: 1, iter: false, style: 2 },
    { z: [0, 1, 2, 3, 4].map(k => polar(1.25, Math.PI / 2 + k * 2 * Math.PI / 5)), p: [0, 1, 2, 3, 4].map(k => polar(0.6, Math.PI / 2 + (k + 0.5) * 2 * Math.PI / 5)), warp: 1, iter: false, style: 0 },
    // Blaschke: poles at 1/conj(a) mirror each zero through the unit circle, so |f| = 1 there
    { z: [[0.5, 0.2], [-0.3, 0.55], [-0.4, -0.45], [0.25, -0.6]], p: null, warp: 1, iter: false, style: 1 },
    { z: [0, 1, 2].map(k => polar(1, k * 2 * Math.PI / 3)), p: [[0.3, 0.0], [-0.15, 0.26]], warp: 1, iter: true, style: 0 },
    { z: [[0.9, 0.3], [-0.4, 0.8], [-0.7, -0.5], [0.3, -0.85]], p: [[0.25, 0.1], [-0.2, -0.2], [0.5, 0.55]], warp: 3, iter: false, style: 2 },
  ];
  function loadPreset(i) {
    const P = PRESETS[i];
    zeros.length = 0; poles.length = 0;
    P.z.forEach(([x, y]) => zeros.push(mk(x, y)));
    const pl = P.p || P.z.map(([x, y]) => { const d = x * x + y * y; return [x / d, y / d]; });
    pl.forEach(([x, y]) => poles.push(mk(x, y)));
    $("warp").value = P.warp; $("iter").checked = P.iter; $("style").value = P.style;
    view.x = 0; view.y = 0; view.s = P.p ? 1.6 : 2.2;
    sync();
  }
  const view = { x: 0, y: 0, s: 1.6 };

  // ---------- Controls ----------
  const fmt = { spin: v => v.toFixed(2), flow: v => v.toFixed(2), lines: v => v === 0 ? "off" : v, warp: v => v === 1 ? "off" : v };
  function sync() {
    for (const id in fmt) $(id + "o").textContent = fmt[id](+$(id).value);
    const k = +$("warp").value, v = k > 1 ? `z^${k}` : "z";
    let s = `f(z) = ${zeros.length ? "Π(z − a)" : "1"} / ${poles.length ? "Π(z − b)" : "1"},  ${zeros.length} zeros, ${poles.length} poles`;
    if (k > 1 || $("iter").checked) s += `\nshowing ${$("iter").checked ? `f(f(${v}))` : `f(${v})`}`;
    $("formula").textContent = s;
  }
  Object.keys(fmt).forEach(id => $(id).addEventListener("input", sync));
  $("iter").addEventListener("change", sync);
  $("preset").onchange = () => loadPreset(+$("preset").value);
  const spawn = () => { const a = rng() * 6.28, r = 0.3 + rng() * 0.9; return [view.x + r * Math.cos(a), view.y + r * Math.sin(a)]; };
  const order = [];                                       // add history, so "Remove last" is meaningful
  const add = (list) => { if (list.length < MAXN) { const h = mk(...spawn()); list.push(h); order.push({ h, list }); sync(); } };
  $("addZ").onclick = () => add(zeros);
  $("addP").onclick = () => add(poles);
  $("del").onclick = () => {
    const last = order.pop();
    if (last && last.list.includes(last.h)) last.list.splice(last.list.indexOf(last.h), 1);
    else if (poles.length >= zeros.length && poles.length) poles.pop(); else zeros.pop();
    sync();
  };
  $("reseed").onclick = () => {
    seed = (Math.random() * 1e9) >>> 0;
    palOff = [rng(), rng(), rng()];
    [...zeros, ...poles].forEach(h => { h.f1 = 0.2 + rng() * 0.3; h.f2 = 0.2 + rng() * 0.3; h.p1 = rng() * 6.28; h.p2 = rng() * 6.28; });
  };

  const panel = $("panel"), recBtn = () => document.getElementById("recBtn");
  let handlesOn = true;
  function toggleUI() { panel.classList.toggle("hidden"); handlesOn = !panel.classList.contains("hidden"); const b = recBtn(); if (b) b.classList.toggle("hidden"); }
  $("hide").onclick = toggleUI;
  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input,textarea,select")) return;
    if (e.key === "h" || e.key === "H") toggleUI();
    if (e.key === "r" || e.key === "R") { const b = recBtn(); if (b) b.click(); }
  });
  $("fs").onclick = async () => {
    try { await document.documentElement.requestFullscreen(); }
    catch { $("err").textContent = "Full screen is blocked in this view. Open the page in its own tab to use it."; }
  };

  // ---------- Pointer ----------
  const toZ = (e) => { const r = canvas.getBoundingClientRect(); const s = view.s / (0.5 * r.height);
    return [(e.clientX - r.left - r.width / 2) * s + view.x, -(e.clientY - r.top - r.height / 2) * s + view.y, s]; };
  function hit(e) {
    const [x, y, s] = toZ(e); let best = null, bd = 20 * s;   // 20 px grab radius
    for (const list of [zeros, poles]) for (const h of list) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = { h, list }; } }
    return best;
  }
  let drag = null, hot = null;
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    const [x, y] = toZ(e), hh = hit(e);
    if (e.button === 2) {                                   // right: remove handle or add pole
      if (hh) hh.list.splice(hh.list.indexOf(hh.h), 1);
      else if (poles.length < MAXN) { const h = mk(x, y); poles.push(h); order.push({ h, list: poles }); }
      sync(); return;
    }
    if (hh) { drag = { kind: "handle", h: hh.h, dx: hh.h.x - x, dy: hh.h.y - y }; canvas.classList.add("drag"); }
    else drag = { kind: "pan", sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false, shift: e.shiftKey, x, y };
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) { const hh = hit(e); hot = hh; canvas.classList.toggle("over", !!hh); return; }
    const [x, y] = toZ(e);
    if (drag.kind === "handle") {
      // set the base so that drift continues from where the handle is dropped
      const h = drag.h, ox = h.x - h.bx, oy = h.y - h.by;
      h.bx = x + drag.dx - ox; h.by = y + drag.dy - oy;
    } else {
      const r = canvas.getBoundingClientRect(), s = view.s / (0.5 * r.height);
      const mx = e.clientX - drag.sx, my = e.clientY - drag.sy;
      if (Math.hypot(mx, my) > 4) drag.moved = true;
      if (drag.moved) { view.x = drag.vx - mx * s; view.y = drag.vy + my * s; }
    }
  });
  const end = () => {
    if (drag && drag.kind === "pan" && !drag.moved) {        // a click on empty space adds a handle
      const list = drag.shift ? poles : zeros;
      if (list.length < MAXN) { const h = mk(drag.x, drag.y); list.push(h); order.push({ h, list }); sync(); }
    }
    drag = null; canvas.classList.remove("drag");
  };
  canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", () => { drag = null; canvas.classList.remove("drag"); });
  canvas.addEventListener("dblclick", (e) => {
    const hh = hit(e);
    // the first click of the double-click added a handle on empty space; take it back
    if (hh) { hh.list.splice(hh.list.indexOf(hh.h), 1); const o = order.at(-1); if (o && o.h === hh.h) order.pop(); sync(); }
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const [x, y] = toZ(e), k = Math.exp(e.deltaY * 0.0012);
    view.s = Math.min(20, Math.max(0.05, view.s * k));
    view.x = x + (view.x - x) * k; view.y = y + (view.y - y) * k;   // zoom about the cursor
  }, { passive: false });

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr); canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener("resize", resize);

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) { $("spin").value = 0.08; $("flow").value = 0.1; $("drift").checked = false; }
  loadPreset(0);
  // URL parameters preset the controls, e.g. ?preset=3&style=2
  const qs = new URLSearchParams(location.search);
  if (qs.has("preset")) { $("preset").value = qs.get("preset"); loadPreset(+qs.get("preset")); }
  qs.forEach((v, k) => { const el = $(k); if (k !== "preset" && el) { if (el.type === "checkbox") el.checked = v === "1"; else el.value = v; } });
  sync(); resize();

  const zBuf = new Float32Array(MAXN * 2), pBuf = new Float32Array(MAXN * 2);
  let t = 0, spin = 0, flow = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    t += dt;
    spin = (spin + dt * +$("spin").value * 0.25) % 1;
    flow = (flow + dt * +$("flow").value * 0.6) % 1;
    const amp = $("drift").checked ? 0.12 : 0;
    zBuf.fill(0); pBuf.fill(0);
    [[zeros, zBuf], [poles, pBuf]].forEach(([list, buf]) => list.forEach((h, i) => {
      const dragged = drag && drag.h === h;
      const tx = h.bx + (dragged ? 0 : amp * Math.sin(t * h.f1 + h.p1));
      const ty = h.by + (dragged ? 0 : amp * Math.sin(t * h.f2 + h.p2));
      h.x += (tx - h.x) * Math.min(1, dt * 12); h.y += (ty - h.y) * Math.min(1, dt * 12);
      if (dragged) { h.x = tx; h.y = ty; }
      buf[2 * i] = h.x; buf[2 * i + 1] = h.y;
    }));
    let hotIdx = -1;
    const hh = drag && drag.h ? { h: drag.h, list: zeros.includes(drag.h) ? zeros : poles } : hot;
    if (hh && hh.list.includes(hh.h)) hotIdx = (hh.list === zeros ? 0 : MAXN) + hh.list.indexOf(hh.h);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform2f(U.uView, view.x, view.y);
    gl.uniform1f(U.uScale, view.s);
    gl.uniform2fv(U.uZ, zBuf); gl.uniform2fv(U.uP, pBuf);
    gl.uniform1i(U.uNZ, zeros.length); gl.uniform1i(U.uNP, poles.length);
    gl.uniform1i(U.uStyle, +$("style").value);
    gl.uniform1i(U.uIter, $("iter").checked ? 1 : 0);
    gl.uniform1i(U.uHandles, handlesOn ? 1 : 0);
    gl.uniform1i(U.uHot, hotIdx);
    gl.uniform1f(U.uSpin, spin);
    gl.uniform1f(U.uFlow, flow);
    gl.uniform1f(U.uLines, +$("lines").value);
    gl.uniform1f(U.uWarp, +$("warp").value);
    gl.uniform3fv(U.uPal, palOff);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<!-- Clip recorder: captures the canvas (not the controls) via MediaRecorder,
     then offers the file through the page's downloads capability. -->
<style>
.rec { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 10;
  font: 600 13px "Instrument Sans", system-ui, sans-serif; color: #f3f0ea; background: rgba(20,20,24,0.78);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 7px 14px; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; }
.rec.on { background: rgba(170, 30, 40, 0.88); }
.rec:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<button class="rec" id="recBtn" aria-live="polite">Record clip</button>
<script>
(() => {
  const btn = document.getElementById("recBtn");
  const canvas = document.querySelector("canvas");
  const LIMIT = 30;
  if (!canvas || !canvas.captureStream || !window.MediaRecorder) return;
  const TYPES = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const mime = TYPES.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return;
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
  let downloads = null, rec = null, chunks = [], t0 = 0, tick = null;
  (async () => {
    if (!window.claude || !window.claude.use) return;
    downloads = await window.claude.use("downloads");
    if (downloads) btn.style.display = "block";
  })();
  function stop() { if (rec && rec.state === "recording") rec.stop(); }
  btn.onclick = () => {
    if (rec && rec.state === "recording") return stop();
    chunks = [];
    rec = new MediaRecorder(canvas.captureStream(60), { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      clearInterval(tick); btn.classList.remove("on"); btn.textContent = "Saving...";
      const blob = new Blob(chunks, { type: mime });
      const slug = document.title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      try { await downloads.save({ filename: `${slug}-${stamp}.${ext}`, data: blob }); btn.textContent = "Saved"; }
      catch (e) { btn.textContent = e && e.code === "declined" ? "Not saved" : "Save failed"; }
      setTimeout(() => { btn.textContent = "Record clip"; }, 2000);
    };
    rec.start(250);
    t0 = performance.now(); btn.classList.add("on"); btn.textContent = "Stop  0 s";
    tick = setInterval(() => {
      const s = Math.floor((performance.now() - t0) / 1000);
      btn.textContent = `Stop  ${s} s`;
      if (s >= LIMIT) stop();
    }, 250);
  };
})();
</script>
</body>
</html>
