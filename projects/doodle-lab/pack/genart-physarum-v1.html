<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physarum culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
  Physarum culture (Jones 2010 agent model).
  Each agent senses the trail map ahead-left / ahead / ahead-right, turns
  toward the strongest reading, moves, and deposits. The trail map is
  blurred and decayed every step. Agents are confined to a circular dish.
*/
:root {
  --panel-bg: rgba(20, 16, 24, 0.78);
  --panel-fg: #f1eadb;
  --panel-muted: #bcae95;
  --accent: #e8cf8f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel-bg: rgba(20, 16, 24, 0.78); } }
:root[data-theme="dark"] { --panel-bg: rgba(20, 16, 24, 0.78); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { background: #1b2a2a; overflow: hidden; font-family: "Instrument Sans", system-ui, -apple-system, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel {
  position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(290px, calc(100vw - 24px)); background: var(--panel-bg); color: var(--panel-fg);
  border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 13px; line-height: 1.4;
}
.panel summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.panel summary::-webkit-details-marker { display: none; }
.panel summary .count { font-weight: 400; color: var(--panel-muted); font-variant-numeric: tabular-nums; }
.body { padding: 2px 14px 14px; display: grid; gap: 9px; }
label { display: grid; grid-template-columns: 88px 1fr 40px; align-items: center; gap: 8px; color: var(--panel-muted); }
label output { color: var(--panel-fg); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit; color: var(--panel-fg); background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--panel-muted); font-size: 12px; }
</style>
<script src="../tools/lab-shim.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<details class="panel" open>
  <summary><span>Controls</span><span class="count" id="count"></span></summary>
  <div class="body">
    <label>Sensor angle <input type="range" id="sa" min="5" max="90" step="1" value="30"><output id="sao"></output></label>
    <label>Sensor reach <input type="range" id="so" min="3" max="40" step="0.5" value="11"><output id="soo"></output></label>
    <label>Turn angle <input type="range" id="ra" min="5" max="90" step="1" value="40"><output id="rao"></output></label>
    <label>Trail memory <input type="range" id="decay" min="0.80" max="0.995" step="0.005" value="0.92"><output id="decayo"></output></label>
    <div class="row">
      <button id="reseed">New culture</button>
      <button id="palette">Change stain</button>
      <button id="pause">Pause</button>
    </div>
    <div class="hint">Tap the dish to inoculate. Space starts a new culture.</div>
  </div>
</details>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);

  // Stains: 3-stop gradient from empty agar to dense network, plus outside-dish color
  const PALETTES = [
    { name: "Agar", stops: [[205, 185, 142], [150, 88, 58], [46, 30, 58]], outside: [27, 42, 42] },
    { name: "Bioluminescent", stops: [[8, 26, 34], [48, 150, 146], [244, 232, 186]], outside: [4, 12, 16] },
    { name: "Gram stain", stops: [[232, 226, 234], [178, 70, 120], [44, 30, 96]], outside: [40, 36, 52] },
  ];
  let paletteIdx = 0, lut = new Uint32Array(256), outsideColor = 0;

  let gw, gh, N, R, cx, cy;
  let trail, next, mask, img, img32;
  let ax, ay, ah;                  // agent arrays: position and heading
  let running = true, steps = 0;

  const P = { sa: 0, so: 0, ra: 0, decay: 0 };
  function readParams() {
    P.sa = $("sa").value * Math.PI / 180; P.so = +$("so").value;
    P.ra = $("ra").value * Math.PI / 180; P.decay = +$("decay").value;
    $("sao").textContent = $("sa").value + "°"; $("soo").textContent = $("so").value;
    $("rao").textContent = $("ra").value + "°"; $("decayo").textContent = (+$("decay").value).toFixed(3);
  }

  function buildLut() {
    const pal = PALETTES[paletteIdx], [a, b, c] = pal.stops;
    for (let i = 0; i < 256; i++) {
      const t = i / 255;
      const [p, q, u] = t < 0.5 ? [a, b, t * 2] : [b, c, (t - 0.5) * 2];
      const r = p[0] + (q[0] - p[0]) * u, g = p[1] + (q[1] - p[1]) * u, bl = p[2] + (q[2] - p[2]) * u;
      lut[i] = (255 << 24) | (bl << 16) | (g << 8) | r;
    }
    const o = pal.outside;
    outsideColor = (255 << 24) | (o[2] << 16) | (o[1] << 8) | o[0];
    document.body.style.background = `rgb(${o.join(",")})`;
  }

  function resize() {
    // Size the simulation grid to ~320k cells so it runs on phones too
    const aspect = innerWidth / innerHeight;
    const cells = Math.min(320000, innerWidth * innerHeight * Math.min(devicePixelRatio || 1, 2) ** 2);
    gh = Math.round(Math.sqrt(cells / aspect)); gw = Math.round(gh * aspect);
    canvas.width = gw; canvas.height = gh;
    R = Math.min(gw, gh) * 0.46; cx = gw / 2; cy = gh / 2;
    trail = new Float32Array(gw * gh); next = new Float32Array(gw * gh);
    mask = new Uint8Array(gw * gh);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      const dx = x - cx, dy = y - cy;
      mask[y * gw + x] = dx * dx + dy * dy < R * R ? 1 : 0;
    }
    img = ctx.createImageData(gw, gh); img32 = new Uint32Array(img.data.buffer);
    N = Math.round(Math.PI * R * R * 0.35);   // agent density relative to dish area
    ax = new Float32Array(N); ay = new Float32Array(N); ah = new Float32Array(N);
    seed();
  }

  // Place a fraction of agents in a small disk at (px, py), headings pointing outward
  function inoculate(px, py, from, to, radius) {
    for (let i = from; i < to; i++) {
      const ang = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * radius;
      ax[i] = px + Math.cos(ang) * r; ay[i] = py + Math.sin(ang) * r;
      ah[i] = ang + (Math.random() - 0.5) * 0.6;
    }
  }
  function seed() {
    trail.fill(0); steps = 0;
    inoculate(cx, cy, 0, N, R * 0.06);
  }

  function sense(x, y, h) {
    const sx = (x + Math.cos(h) * P.so) | 0, sy = (y + Math.sin(h) * P.so) | 0;
    if (sx < 0 || sy < 0 || sx >= gw || sy >= gh) return 0;
    return trail[sy * gw + sx];
  }

  function step() {
    const { sa, ra } = P, R2 = R * R;
    for (let i = 0; i < N; i++) {
      let x = ax[i], y = ay[i], h = ah[i];
      const f = sense(x, y, h), fl = sense(x, y, h + sa), fr = sense(x, y, h - sa);
      if (f > fl && f > fr) { /* keep heading */ }
      else if (f < fl && f < fr) h += (Math.random() < 0.5 ? 1 : -1) * ra;
      else if (fl > fr) h += ra;
      else if (fr > fl) h -= ra;
      const nx = x + Math.cos(h), ny = y + Math.sin(h);
      const dx = nx - cx, dy = ny - cy;
      if (dx * dx + dy * dy >= R2) {
        // Hit the dish wall: turn back toward the interior with some jitter
        h = Math.atan2(cy - y, cx - x) + (Math.random() - 0.5) * 1.6;
      } else { x = nx; y = ny; }
      ax[i] = x; ay[i] = y; ah[i] = h;
      trail[(y | 0) * gw + (x | 0)] += 1;
    }
    // 3x3 blur + decay into `next`, then swap
    const decay = P.decay / 9;
    for (let y = 1; y < gh - 1; y++) {
      const row = y * gw;
      for (let x = 1; x < gw - 1; x++) {
        const k = row + x;
        if (!mask[k]) { next[k] = 0; continue; }
        next[k] = (trail[k - gw - 1] + trail[k - gw] + trail[k - gw + 1] +
                   trail[k - 1] + trail[k] + trail[k + 1] +
                   trail[k + gw - 1] + trail[k + gw] + trail[k + gw + 1]) * decay;
      }
    }
    const t = trail; trail = next; next = t;
    steps++;
  }

  function render() {
    // Soft saturation tone map: 1 - exp(-k * v)
    for (let k = 0; k < trail.length; k++) {
      if (!mask[k]) { img32[k] = outsideColor; continue; }
      const v = 1 - Math.exp(-trail[k] * 0.35);
      img32[k] = lut[(v * 255) | 0];
    }
    ctx.putImageData(img, 0, 0);
    $("count").textContent = `${(N / 1000).toFixed(0)}k agents`;
  }

  function loop() {
    if (running) { step(); render(); }
    requestAnimationFrame(loop);
  }

  // ---------- UI ----------
  ["sa", "so", "ra", "decay"].forEach(id => $(id).addEventListener("input", readParams));
  $("reseed").onclick = seed;
  $("pause").onclick = () => { running = !running; $("pause").textContent = running ? "Pause" : "Resume"; };
  $("palette").onclick = () => { paletteIdx = (paletteIdx + 1) % PALETTES.length; buildLut(); render(); };
  canvas.addEventListener("pointerdown", (e) => {
    const r = canvas.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * gw, py = (e.clientY - r.top) / r.height * gh;
    if ((px - cx) ** 2 + (py - cy) ** 2 >= R * R * 0.95) return;
    // Move a random 12% slice of agents to the tap point
    const count = Math.floor(N * 0.12), start = Math.floor(Math.random() * (N - count));
    inoculate(px, py, start, start + count, R * 0.03);
  });
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); seed(); } });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 200); });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { running = false; $("pause").textContent = "Resume"; }

  readParams(); buildLut(); resize();
  requestAnimationFrame(loop);
})();
</script>
<!-- Clip recorder: captures the canvas (not the controls) via MediaRecorder,
     then offers the file through the page's downloads capability. -->
<style>
.rec { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 10;
  font: 600 13px "Instrument Sans", system-ui, sans-serif; color: #f3f0ea; background: rgba(20,20,24,0.78);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 7px 14px; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; }
.rec.on { background: rgba(170, 30, 40, 0.88); }
.rec:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<button class="rec" id="recBtn" aria-live="polite">Record clip</button>
<script>
(() => {
  const btn = document.getElementById("recBtn");
  const canvas = document.querySelector("canvas");
  const LIMIT = 30;                                   // seconds; auto-stops here
  if (!canvas || !canvas.captureStream || !window.MediaRecorder) return;
  const TYPES = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const mime = TYPES.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return;
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
  let downloads = null, rec = null, chunks = [], t0 = 0, tick = null;

  (async () => {
    if (!window.claude || !window.claude.use) return;
    downloads = await window.claude.use("downloads");
    if (downloads) btn.style.display = "block";
  })();

  function stop() { if (rec && rec.state === "recording") rec.stop(); }
  btn.onclick = () => {
    if (rec && rec.state === "recording") return stop();
    chunks = [];
    rec = new MediaRecorder(canvas.captureStream(60), { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      clearInterval(tick); btn.classList.remove("on"); btn.textContent = "Saving...";
      const blob = new Blob(chunks, { type: mime });
      const slug = document.title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      try { await downloads.save({ filename: `${slug}-${stamp}.${ext}`, data: blob }); btn.textContent = "Saved"; }
      catch (e) { btn.textContent = e && e.code === "declined" ? "Not saved" : "Save failed"; }
      setTimeout(() => { btn.textContent = "Record clip"; }, 2000);
    };
    rec.start(250);
    t0 = performance.now(); btn.classList.add("on"); btn.textContent = "Stop  0 s";
    tick = setInterval(() => {
      const s = Math.floor((performance.now() - t0) / 1000);
      btn.textContent = `Stop  ${s} s`;
      if (s >= LIMIT) stop();
    }, 250);
  };
})();
</script>

</body>
</html>
