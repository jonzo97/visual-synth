<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometry oscillator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
  Geometry oscillator: three shader sources meant as dry signal for a
  modular visual synth chain.
   1. Hyperbolic {p,q} tiling in the Poincare disk (reflection-group folding,
      animated by a Mobius translation).
   2. Quasicrystal: sum of N plane waves at angles pi*k/N.
   3. 4D polytopes: vertices rotated in 4D (JS), perspective-projected to 2D,
      edges passed to the shader as segments and rendered as glowing lines.
  All sources pass through an optional polar kaleidoscope fold.
  H toggles the UI for clean capture.
*/
:root {
  --panel-bg: rgba(18, 14, 30, 0.8);
  --panel-fg: #efe9f7;
  --panel-muted: #b0a6c4;
  --accent: #c9a7ff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel-bg: rgba(18, 14, 30, 0.8); } }
:root[data-theme="dark"] { --panel-bg: rgba(18, 14, 30, 0.8); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body { background: #000; overflow: hidden; font-family: "Instrument Sans", system-ui, -apple-system, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.panel {
  position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100vw - 24px)); background: var(--panel-bg); color: var(--panel-fg);
  border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 13px; line-height: 1.4;
}
.panel.hidden { display: none; }
.panel summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style: none; }
.panel summary::-webkit-details-marker { display: none; }
.body { padding: 2px 14px 14px; display: grid; gap: 9px; }
label { display: grid; grid-template-columns: 88px 1fr 58px; align-items: center; gap: 8px; color: var(--panel-muted); }
label output { color: var(--panel-fg); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
select, button {
  font: inherit; color: var(--panel-fg); background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
select { flex: 1; }
select option { color: #1b1b1b; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--panel-muted); font-size: 12px; }
.error { color: #ffb4a8; white-space: pre-wrap; font-size: 12px; }
</style>
<script src="../tools/lab-shim.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<details class="panel" id="panel" open>
  <summary>Geometry oscillator</summary>
  <div class="body">
    <div class="row">
      <select id="scene" aria-label="Source">
        <option value="0">Hyperbolic tiling</option>
        <option value="1">Quasicrystal waves</option>
        <option value="2">4D polytope</option>
      </select>
      <select id="pal" aria-label="Palette">
        <option value="0">Iridescent</option>
        <option value="1">Stained glass</option>
        <option value="2">Luma only</option>
      </select>
    </div>
    <label><span id="aLabel">A</span> <input type="range" id="a"><output id="ao"></output></label>
    <label><span id="bLabel">B</span> <input type="range" id="b"><output id="bo"></output></label>
    <label>Mirror folds <input type="range" id="folds" min="1" max="12" step="1" value="1"><output id="foldso"></output></label>
    <label>Speed <input type="range" id="speed" min="0" max="2" step="0.01" value="0.6"><output id="speedo"></output></label>
    <div class="row">
      <button id="fs">Full screen</button>
      <button id="hide">Hide controls</button>
    </div>
    <div class="hint">H toggles controls. Mirror folds above 1 turn any source into a mandala.</div>
    <div class="error" id="err"></div>
  </div>
</details>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: false });
  if (!gl) { $("err").textContent = "This source needs WebGL2, which this browser does not provide."; return; }

  const MAX_EDGES = 96;
  const VS = `#version 300 es
  in vec2 pos; void main(){ gl_Position = vec4(pos, 0.0, 1.0); }`;

  const FS = `#version 300 es
  precision highp float;
  out vec4 outColor;
  uniform vec2 uRes; uniform float uTime; uniform int uScene; uniform int uPal;
  uniform float uA; uniform float uB; uniform float uFolds;
  uniform vec4 uEdges[${MAX_EDGES}]; uniform vec4 uDepth[${MAX_EDGES / 4}]; uniform int uCount;
  #define PI 3.14159265359

  vec3 pal(float t) {
    if (uPal == 0) return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67)));
    if (uPal == 1) return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 0.5) * t + vec3(0.8, 0.9, 0.3)));
    return vec3(0.5 + 0.5 * cos(6.28318 * t));
  }

  // Polar kaleidoscope: fold the angle into one mirrored wedge
  vec2 kfold(vec2 p) {
    if (uFolds < 1.5) return p;
    float s = PI / floor(uFolds);
    float a = mod(atan(p.y, p.x), 2.0 * s);
    a = abs(a - s);
    return length(p) * vec2(cos(a), sin(a));
  }

  vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
  vec2 cdiv(vec2 a, vec2 b) { return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / dot(b, b); }

  // Hyperbolic {p,q}: fold into the (pi/p, pi/q, pi/2) triangle by reflections
  vec3 hyperbolic(vec2 z, float px) {
    float r = length(z);
    if (r >= 1.0) return vec3(0.0);
    float p = uA, q = uB;
    // Mobius translation drifts the whole tiling through the disk
    vec2 a = 0.55 * vec2(sin(uTime * 0.21), sin(uTime * 0.13 + 1.0));
    z = cdiv(z + a, vec2(1.0, 0.0) + cmul(vec2(a.x, -a.y), z));
    float sp = sin(PI / p), cq = cos(PI / q);
    float rr = 1.0 / sqrt(cq * cq / (sp * sp) - 1.0);    // edge geodesic radius
    vec2 c = vec2(sqrt(1.0 + rr * rr), 0.0);             // orthogonal to unit circle
    float seg = PI / p, inv = 0.0, flips = 0.0;
    for (int i = 0; i < 64; i++) {
      float ang = atan(z.y, z.x);
      ang -= floor(ang / (2.0 * seg)) * 2.0 * seg;
      if (ang > seg) { ang = 2.0 * seg - ang; flips += 1.0; }
      z = length(z) * vec2(cos(ang), sin(ang));
      vec2 w = z - c; float l2 = dot(w, w);
      if (l2 < rr * rr) { z = c + w * (rr * rr / l2); inv += 1.0; } else break;
    }
    float parity = mod(inv + flips, 2.0);
    float edge = abs(length(z - c) - rr);                        // polygon edges
    float spoke = min(abs(z.y), abs(dot(z, vec2(-sin(seg), cos(seg))))); // inner star lines
    float scale = px * 2.0 / max(1.0 - r * r, 0.02);             // antialias in hyperbolic scale
    vec3 col = pal(inv * 0.07 + uTime * 0.03 + parity * 0.12);
    col *= 0.55 + 0.45 * smoothstep(0.0, 0.25, length(z));
    col = mix(col, col * 0.35, smoothstep(scale * 2.0, 0.0, spoke) * 0.5);
    col = mix(col, vec3(0.02), smoothstep(scale * 2.5, scale * 0.5, edge));
    return col * smoothstep(1.0, 1.0 - px * 3.0, r);
  }

  vec3 quasicrystal(vec2 p) {
    p *= uB;
    float n = uA, v = 0.0;
    for (int i = 0; i < 16; i++) {
      if (float(i) >= n) break;
      float a = PI * float(i) / n;
      v += cos(dot(p, vec2(cos(a), sin(a))) + uTime * 1.3);
    }
    float s = v / n;
    return pal(s * 0.9 + uTime * 0.03) * (0.5 + 0.5 * cos(s * 16.0));
  }

  vec3 polytope(vec2 p) {
    vec3 col = vec3(0.0);
    for (int i = 0; i < ${MAX_EDGES}; i++) {
      if (i >= uCount) break;
      vec4 e = uEdges[i];
      vec2 pa = p - e.xy, ba = e.zw - e.xy;
      float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
      float d = length(pa - ba * h);
      float dep = uDepth[i / 4][i % 4];                          // 0 = far in w, 1 = near
      float I = exp(-d * 260.0) + 0.22 * exp(-d * 28.0);
      col += pal(dep * 0.6 + uTime * 0.04) * I * (0.35 + 0.65 * dep);
    }
    return 1.0 - exp(-col * 1.6);
  }

  void main() {
    float m = min(uRes.x, uRes.y);
    vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / (0.5 * m);
    float px = 2.0 / m;
    p = kfold(p);
    vec3 col;
    if (uScene == 0) col = hyperbolic(p * 1.04, px);
    else if (uScene == 1) col = quasicrystal(p);
    else col = polytope(p);
    outColor = vec4(col, 1.0);
  }`;

  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { $("err").textContent = "Shader error:\n" + e.message; return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "pos");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ["uRes", "uTime", "uScene", "uPal", "uA", "uB", "uFolds", "uEdges", "uDepth", "uCount"].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // ---------- 4D polytopes ----------
  function buildPolytope(kind) {
    let V = [];
    if (kind === 0) { // 16-cell: +-e_i
      for (let i = 0; i < 4; i++) for (const s of [1, -1]) { const v = [0, 0, 0, 0]; v[i] = s; V.push(v); }
    } else if (kind === 1) { // tesseract: all sign combinations
      for (let m = 0; m < 16; m++) V.push([0, 1, 2, 3].map(b => (m >> b & 1) ? 1 : -1));
    } else { // 24-cell: permutations of (+-1, +-1, 0, 0)
      for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) for (const si of [1, -1]) for (const sj of [1, -1]) {
        const v = [0, 0, 0, 0]; v[i] = si; v[j] = sj; V.push(v);
      }
    }
    const d2 = (a, b) => a.reduce((s, x, k) => s + (x - b[k]) ** 2, 0);
    let minD = Infinity;
    for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) minD = Math.min(minD, d2(V[i], V[j]));
    const E = [];
    for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) if (Math.abs(d2(V[i], V[j]) - minD) < 1e-6) E.push([i, j]);
    const rad = Math.sqrt(d2(V[0], [0, 0, 0, 0]));
    return { V: V.map(v => v.map(x => x / rad)), E };
  }
  const POLYS = [buildPolytope(0), buildPolytope(1), buildPolytope(2)];
  const POLY_NAMES = ["16-cell", "Tesseract", "24-cell"];
  const edgeData = new Float32Array(MAX_EDGES * 4), depthData = new Float32Array(MAX_EDGES);

  function rot(v, i, j, a) { const c = Math.cos(a), s = Math.sin(a), x = v[i], y = v[j]; v[i] = c * x - s * y; v[j] = s * x + c * y; }
  function updatePolytope(t, zoom, aspectFix) {
    const P = POLYS[Math.round(state.a)];
    const pts = P.V.map(v0 => {
      const v = v0.slice();
      rot(v, 0, 3, t * 0.31); rot(v, 1, 3, t * 0.23); rot(v, 2, 3, t * 0.17); rot(v, 0, 1, t * 0.11);
      const w = v[3], k = 1.6 / (2.6 - w);            // 4D -> 3D perspective
      let x = v[0] * k, y = v[1] * k, z = v[2] * k;
      const q = [x, y, z]; rot(q, 1, 2, 0.5); rot(q, 0, 2, t * 0.07);
      const k2 = 2.2 / (3.4 - q[2]);                   // 3D -> 2D perspective
      return [q[0] * k2 * zoom, q[1] * k2 * zoom, (w + 1) / 2];
    });
    P.E.forEach(([i, j], n) => {
      edgeData.set([pts[i][0], pts[i][1], pts[j][0], pts[j][1]], n * 4);
      depthData[n] = (pts[i][2] + pts[j][2]) / 2;
    });
    gl.uniform4fv(U.uEdges, edgeData);
    gl.uniform4fv(U.uDepth, depthData);
    gl.uniform1i(U.uCount, P.E.length);
  }

  // ---------- Scene-specific controls ----------
  const SCENES = [
    { a: ["Sides p", 3, 10, 1, 7], b: ["Meet at q", 3, 10, 1, 3] },
    { a: ["Symmetry", 3, 15, 1, 7], b: ["Zoom", 4, 60, 0.5, 22] },
    { a: ["Polytope", 0, 2, 1, 1], b: ["Zoom", 0.4, 1.8, 0.01, 1.0] },
  ];
  const state = { scene: 0, a: 7, b: 3, qEff: 3 };
  function configureScene() {
    const S = SCENES[state.scene];
    [["a", S.a], ["b", S.b]].forEach(([id, [label, min, max, step, def]]) => {
      $(id + "Label").textContent = label;
      Object.assign($(id), { min, max, step }); $(id).value = def; state[id] = def;
    });
    syncOutputs();
  }
  function syncOutputs() {
    state.a = +$("a").value; state.b = +$("b").value;
    if (state.scene === 0) {
      // Hyperbolic requires 1/p + 1/q < 1/2; bump q to the smallest valid value
      state.qEff = state.b; while (1 / state.a + 1 / state.qEff >= 0.5) state.qEff++;
      $("ao").textContent = state.a;
      $("bo").textContent = state.qEff === state.b ? state.b : `${state.qEff}*`;
    } else if (state.scene === 2) {
      $("ao").textContent = POLY_NAMES[Math.round(state.a)]; $("bo").textContent = state.b.toFixed(2);
    } else { $("ao").textContent = state.a; $("bo").textContent = state.b; }
    $("foldso").textContent = +$("folds").value === 1 ? "off" : $("folds").value;
    $("speedo").textContent = (+$("speed").value).toFixed(2);
  }
  $("scene").onchange = () => { state.scene = +$("scene").value; configureScene(); };
  ["a", "b", "folds", "speed"].forEach(id => $(id).addEventListener("input", syncOutputs));

  const panel = $("panel");
  const toggleUI = () => panel.classList.toggle("hidden");
  $("hide").onclick = toggleUI;
  addEventListener("keydown", (e) => { if (e.key === "h" || e.key === "H") toggleUI(); });
  canvas.addEventListener("dblclick", () => panel.classList.remove("hidden"));
  $("fs").onclick = async () => {
    try { await document.documentElement.requestFullscreen(); }
    catch { $("err").textContent = "Full screen is blocked in this view. Open the page in its own tab to use it."; }
  };

  function resize() {
    const scale = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = Math.floor(innerWidth * scale); canvas.height = Math.floor(innerHeight * scale);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener("resize", resize);

  let t = 0, last = performance.now();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) $("speed").value = 0.15;
  function frame(now) {
    t += Math.min(0.05, (now - last) / 1000) * +$("speed").value; last = now;
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform1i(U.uScene, state.scene);
    gl.uniform1i(U.uPal, +$("pal").value);
    gl.uniform1f(U.uFolds, +$("folds").value);
    gl.uniform1f(U.uA, state.a);
    gl.uniform1f(U.uB, state.scene === 0 ? state.qEff : state.b);
    if (state.scene === 2) updatePolytope(t, state.b);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  configureScene(); resize();
  requestAnimationFrame(frame);
})();
</script>
<!-- Clip recorder: captures the canvas (not the controls) via MediaRecorder,
     then offers the file through the page's downloads capability. -->
<style>
.rec { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 10;
  font: 600 13px "Instrument Sans", system-ui, sans-serif; color: #f3f0ea; background: rgba(20,20,24,0.78);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 7px 14px; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; }
.rec.on { background: rgba(170, 30, 40, 0.88); }
.rec:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<button class="rec" id="recBtn" aria-live="polite">Record clip</button>
<script>
(() => {
  const btn = document.getElementById("recBtn");
  const canvas = document.querySelector("canvas");
  const LIMIT = 30;                                   // seconds; auto-stops here
  if (!canvas || !canvas.captureStream || !window.MediaRecorder) return;
  const TYPES = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const mime = TYPES.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return;
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
  let downloads = null, rec = null, chunks = [], t0 = 0, tick = null;

  (async () => {
    if (!window.claude || !window.claude.use) return;
    downloads = await window.claude.use("downloads");
    if (downloads) btn.style.display = "block";
  })();

  function stop() { if (rec && rec.state === "recording") rec.stop(); }
  btn.onclick = () => {
    if (rec && rec.state === "recording") return stop();
    chunks = [];
    rec = new MediaRecorder(canvas.captureStream(60), { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      clearInterval(tick); btn.classList.remove("on"); btn.textContent = "Saving...";
      const blob = new Blob(chunks, { type: mime });
      const slug = document.title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      try { await downloads.save({ filename: `${slug}-${stamp}.${ext}`, data: blob }); btn.textContent = "Saved"; }
      catch (e) { btn.textContent = e && e.code === "declined" ? "Not saved" : "Save failed"; }
      setTimeout(() => { btn.textContent = "Record clip"; }, 2000);
    };
    rec.start(250);
    t0 = performance.now(); btn.classList.add("on"); btn.textContent = "Stop  0 s";
    tick = setInterval(() => {
      const s = Math.floor((performance.now() - t0) / 1000);
      btn.textContent = `Stop  ${s} s`;
      if (s >= LIMIT) stop();
    }, 250);
  };
})();
</script>

</body>
</html>
